# CAIOS control plane. Runs on caios_server (node 1).
#
#   cd compose && docker compose --env-file ../configs/env/caios.env up -d
#
# Why Compose and not Nomad jobs (D-03): these five services need to be
# debuggable in a three-week window. `docker compose logs papi` beats chasing
# allocations through the Nomad UI, and none of them benefit from scheduling.
#
# Why on the same node as the Nomad server: PAPI needs mTLS certificates to
# reach Nomad. On this node Ansible has already written them to
# /etc/nomad.d/certs/, and Nomad answers on 127.0.0.1:4646. Anywhere else means
# copying certificates around and exposing 4646 across the network.

name: caios

services:

  # --------------------------------------------------------------------------
  # Caddy — TLS termination and routing for the four control-plane hostnames.
  # Serves a certificate issued from our own CA; automatic HTTPS is off because
  # Let's Encrypt cannot reach a private subnet. Deployment wildcards are
  # Traefik's job on caios_edge, not ours.
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caios_caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      # Rendered by scripts/render-configs.sh from caddy/Caddyfile.template.
      # The scheme decides the file's STRUCTURE — which site block carries the
      # certificate and which carries the 302 bounce — so it cannot be done
      # with Caddy's own {$$ENV} substitution. Run render-configs.sh after any
      # change to the template or to CAIOS_SCHEME.
      - ./generated/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued from our own CA by scripts/make-control-plane-cert.sh.
      # Caddy's automatic HTTPS cannot work on a private subnet — see the
      # Caddyfile for why.
      - ./certs:/etc/caddy/certs:ro
      # Federated learning bundles, served at /fl/ on the dashboard host.
      # Built by scripts/build-fl-bundles.sh; absent until it has been run,
      # which Caddy tolerates — the route 404s rather than failing to start.
      - ../demo/fl/dist:/srv/fl:ro
      # Marketplace catalogue mirror, served at /mirror/ on the dashboard host
      # and read by PAPI. See CATALOGUE_BASE_URL below.
      - ../catalog/mirror:/srv/catalog:ro
      - caddy_data:/data
      - caddy_config:/config
    # No environment. The Caddyfile used to carry {$CAIOS_DASHBOARD_HOST} and
    # friends for Caddy to expand at start; since T5 it is rendered ahead of
    # time with the hostnames already in it, and passing them here again would
    # only suggest they still do something.
    # Only Keycloak. Caddy must be able to run before PAPI and the dashboard
    # are built — a proxy to a missing upstream returns 502, which is a much
    # better failure mode than the whole ingress refusing to start.
    depends_on:
      - keycloak

  # --------------------------------------------------------------------------
  # Keycloak — login. PAPI validates every token's signature and issuer against
  # this realm, so its public URL must match exactly what PAPI is configured
  # with, including scheme. A mismatch produces 401 on everything.
  # --------------------------------------------------------------------------
  # Postgres behind Keycloak. Not gold-plating: the built-in file database
  # corrupted the first time a realm import failed mid-write, leaving Keycloak
  # unable to start at all ("Database is already closed") and needing its volume
  # deleted. Identity is the one service whose failure takes the whole demo with
  # it, and a proper database costs one container.
  keycloak_db:
    image: postgres:16-alpine
    container_name: caios_keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: caios_keycloak
    restart: unless-stopped
    command: start --import-realm --optimized=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # The issuer, byte for byte. PAPI, Vault and the dashboard all compare
      # against this exact string, so all four derive from CAIOS_SCHEME.
      KC_HOSTNAME: ${CAIOS_SCHEME}://${CAIOS_AUTH_HOST}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak_db:
        condition: service_healthy
    volumes:
      # Rendered by scripts/render-configs.sh — the template carries
      # ${CAIOS_DASHBOARD_HOST} in its redirect URIs, and Keycloak does not
      # expand those itself.
      - ./generated/keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8180:8080"

  # --------------------------------------------------------------------------
  # Vault — per-deployment secrets.
  #
  # Not optional, and not obvious: deploying the federated learning server makes
  # PAPI call create_secret() and create_vault_token() BEFORE it contacts Nomad.
  # Without a Vault that trusts our Keycloak, the headline demo fails at PAPI
  # with an error that looks nothing like a Vault problem.
  #
  # Dev mode is deliberate for MVP: in-memory, auto-unsealed, root token fixed.
  # It means a restart loses every stored secret, which for a demo is a feature
  # (clean state) rather than a bug. V1 switches to file storage and real seals
  # if this cluster is kept.
  # --------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.18
    container_name: caios_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"

  # --------------------------------------------------------------------------
  # Applies Vault's configuration, every time the stack starts.
  #
  # Dev-mode Vault keeps everything in memory, so any restart discards the auth
  # backend, policy and role while leaving Vault looking healthy. Every login
  # then returns "permission denied", which reaches the user as a bare HTTP 500
  # on any deployment with nothing pointing at Vault. This ran into exactly that
  # once; automating it removes the failure mode rather than documenting it.
  #
  # Idempotent, so it costs nothing on an already-configured Vault.
  # --------------------------------------------------------------------------
  vault_init:
    image: hashicorp/vault:1.18
    container_name: caios_vault_init
    depends_on:
      - vault
    restart: on-failure
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      CAIOS_AUTH_HOST: ${CAIOS_AUTH_HOST}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      # Vault validates tokens against the issuer it discovered. Same string
      # as KC_HOSTNAME above, or every deployment that stores a secret 403s.
      CAIOS_SCHEME: ${CAIOS_SCHEME:-https}
    volumes:
      - ./vault/bootstrap.sh:/bootstrap.sh:ro
      - ./certs/caios-ca.pem:/caios-ca.pem:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]

  # --------------------------------------------------------------------------
  # PAPI — the control plane. The only component holding Nomad credentials.
  #
  # When something looks broken in the dashboard, check here first: a
  # misconfigured PAPI renders a perfect UI in which every button fails quietly.
  # --------------------------------------------------------------------------
  papi:
    build:
      context: ../build/ai4-papi          # patched copy; see patches/README.md
      dockerfile: docker/Dockerfile
    image: caios/papi:latest
    container_name: caios_papi
    restart: unless-stopped
    # Host networking so PAPI reaches Nomad at 127.0.0.1:4646. The Nomad server
    # certificate is issued for localhost, 127.0.0.1 and the node's private IP
    # (see roles/nomad/tasks/generate_certificates.yml), so loopback validates
    # correctly — no cert juggling needed.
    network_mode: host
    # Upstream's CMD binds 0.0.0.0:80, which would collide with Caddy on the
    # host network AND expose PAPI directly on the public IP. Rebound to
    # loopback:8000; Caddy is the only thing in front of it.
    # The envsubst step is upstream's and must be kept: it is what expands the
    # ${...} placeholders in our main.yaml.
    command:
      - /bin/bash
      - -lc
      - |
        # Trust our CA before anything else. PAPI validates every token by
        # fetching Keycloak's signing keys over HTTPS from our own domain, and
        # this image has no reason to trust the certificate. Without this,
        # every authenticated request fails with a TLS error that surfaces as a
        # generic 401.
        #
        # update-ca-certificates rather than SSL_CERT_FILE: it appends to the
        # system bundle instead of replacing it, so PAPI can still reach public
        # hosts (GitHub for catalogue metadata, Docker Hub for image tags).
        update-ca-certificates >/dev/null 2>&1 || true
        unset NOMAD_NAMESPACE
        envsubst < etc/main_tmp.yaml > etc/main.yaml
        exec /root/.local/bin/ai4papi-run --host 127.0.0.1 --port 8000
    environment:
      # NOT optional, and not what CLAUDE.md's gotcha 1 implies: PAPI's own
      # Dockerfile sets `ENV IS_PROD=True`. Leaving it "unset" in compose
      # inherits True from the image, and PAPI then refuses to start because
      # Harbor/Jenkins/provenance/LiteLLM tokens are missing — with an error
      # that does not point at the cause. It has to be set to false explicitly.
      IS_PROD: "false"
      # Patched in — upstream hardcodes AI4EOSC's realm in auth.py.
      KEYCLOAK_URL: ${CAIOS_SCHEME}://${CAIOS_AUTH_HOST}/realms/${KEYCLOAK_REALM}
      # Patched in — upstream hardcodes secrets.services.ai4os.eu in secrets.py.
      VAULT_ADDR: http://127.0.0.1:8200
      # Also patched in. Upstream sends an empty role name, which Vault reads as
      # a role literally called "" rather than as its default_role, and refuses
      # with 403 — surfacing as a bare HTTP 500 on every deployment.
      VAULT_ROLE: caios
      # Patched in — upstream hardcodes ai4os-hub/modules-catalog, which is the
      # only thing deciding what the marketplace shows. Ours is a fork pruned
      # from 46 modules to 10 that a medical or neuroscience researcher might
      # actually use; see catalog/keep.txt. PAPI caches the result for six
      # hours, so after changing the fork either restart PAPI or PUT
      # /v1/catalog/modules/refresh.
      MODULES_CATALOGUE_REPO: ${MODULES_CATALOGUE_REPO:-ai4os-hub/modules-catalog}
      # Patched in (0014). Upstream builds the marketplace from
      # raw.githubusercontent.com on every cold request — one fetch for the
      # catalogue, then one per entry — with no timeout, so when that host is
      # unreachable the dashboard shows a spinner that never resolves. It was
      # unreachable from every CAIOS node for about three hours on 2026-09-01.
      #
      # Points at the mirror Caddy serves. Unset or empty behaves as upstream.
      # Refresh the mirror with scripts/mirror-catalogue.sh.
      CATALOGUE_BASE_URL: ${CATALOGUE_BASE_URL:-}
      # Patched in — upstream offers all 68 bioimage.io models the loader
      # supports, two dozen of which are near-duplicates, with whatever is
      # first in the file as the default. Ours is a curated twelve, ordered so
      # a connectomics model is selected by default. Empty = upstream.
      # Generated from catalog/ai4life-models.txt.
      AI4LIFE_MODELS: ${AI4LIFE_MODELS:-}
      # Patched in — upstream gates the LLM tool behind a hardcoded string
      # comparison against "Tesla T4" (routers/v1/deployments/tools.py), which
      # is why the dashboard answered "requires NVIDIA T4 GPUs" on hardware that
      # is strictly more capable. Comma-separated; unset behaves as upstream.
      #
      # The value below is what nomad-device-nvidia 1.1.0 reports since the MIG
      # fix — the plain "NVIDIA H100L-1-12C" it used to report matches nothing
      # now. Re-derive with: bash scripts/check-llm-config.sh
      LLM_GPU_MODELS: ${LLM_GPU_MODELS:-NVIDIA H100L-1-12C MIG 1g.12gb}
      NOMAD_ADDR: ${NOMAD_ADDR}
      NOMAD_CACERT: ${NOMAD_CACERT}
      NOMAD_CLIENT_CERT: ${NOMAD_CLIENT_CERT}
      NOMAD_CLIENT_KEY: ${NOMAD_CLIENT_KEY}
      DASHBOARD_URL: ${DASHBOARD_URL}
      # Python's requests uses certifi, not the system store, so point it at
      # the bundle the command above refreshes.
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      # Stage O3. Consumed by main.yaml's oscar block through the envsubst
      # the image runs at start. Unset would leave the placeholder literal.
      CAIOS_OSCAR_ENDPOINT: ${CAIOS_OSCAR_ENDPOINT}
      # Read-only, for the warm/cold badge only. Unset disables it.
      OSCAR_K8S_API: ${OSCAR_K8S_API:-}
      OSCAR_K8S_TOKEN_PATH: ${OSCAR_K8S_TOKEN_PATH:-}
      # T5. PAPI stamps this on every endpoint it advertises to the dashboard
      # (nomad_utils) and on the vLLM base URL it hands Open WebUI (tools.py),
      # and it decides whether the Traefik router tags it renders ask for TLS.
      # Unset behaves as https, which is what upstream hardcoded.
      CAIOS_SCHEME: ${CAIOS_SCHEME:-https}
      CAIOS_CTRL_IP: ${CAIOS_CTRL_IP}
      CAIOS_EDGE_IP: ${CAIOS_EDGE_IP}
      CAIOS_PUBLIC_IP: ${CAIOS_PUBLIC_IP}
    volumes:
      # Mounted over main_TMP.yaml, not main.yaml. The image copies main.yaml to
      # main_tmp.yaml at build time and regenerates main.yaml from it through
      # envsubst on every start — so anything mounted at main.yaml is silently
      # overwritten a second later. WORKDIR is /home/ai4-papi, not /srv.
      - ../configs/papi/main.yaml:/home/ai4-papi/etc/main_tmp.yaml:ro
      - ../configs/papi/var/datacenters.csv:/home/ai4-papi/var/datacenters.csv:ro
      # Our GPU reports as 'NVIDIA H100L-1-12C', a 12 GB vGPU slice, which is
      # not in upstream's list. Without a row here the dashboard shows the
      # model with no specs against it.
      - ../configs/papi/var/gpu_models.csv:/home/ai4-papi/var/gpu_models.csv:ro
      - ../configs/papi/tools/ai4os-federated-server/user.yaml:/home/ai4-papi/etc/tools/ai4os-federated-server/user.yaml:ro
      # The LLM tool. Three files, and each one fixes something that would
      # otherwise stop it dead — see docs/llm-risks.md.
      #
      # nomad.hcl: upstream pins the GPU device to a Tesla T4 (job pends
      # forever), asks for 8 CPU cores and 32 GB on 3-core 30 GB nodes (job
      # never places), and has both helper tasks call their own PUBLIC HTTPS
      # URL, which dies on our self-signed CA and takes the allocation with it.
      - ../configs/papi/tools/ai4os-llm/nomad.hcl:/home/ai4-papi/etc/tools/ai4os-llm/nomad.hcl:ro
      - ../configs/papi/tools/ai4os-llm/user.yaml:/home/ai4-papi/etc/tools/ai4os-llm/user.yaml:ro
      # vllm.yaml: upstream's catalogue is tuned for a 16 GB Tesla T4 at compute
      # capability 7.5. Ours has 9680 MiB of usable budget at capability 9.0, so
      # every model needs --gpu-memory-utilization 0.80 and none of them needs
      # --dtype float16. Nine models rather than thirteen.
      - ../configs/papi/vllm.yaml:/home/ai4-papi/etc/vllm.yaml:ro
      # CPU defaults capped to what a 3-vCPU node can actually place. Upstream
      # defaults (2 for modules, 4 for the dev environment) queue forever with
      # "Dimension cpu exhausted" — see the note inside these files.
      - ../configs/papi/modules-user.yaml:/home/ai4-papi/etc/modules/user.yaml:ro
      - ../configs/papi/tools/ai4os-dev-env/user.yaml:/home/ai4-papi/etc/tools/ai4os-dev-env/user.yaml:ro
      # Our CA, so PAPI can verify Keycloak's HTTPS certificate. Picked up by
      # update-ca-certificates in the command above.
      #
      # Repo-relative, NOT ${HOME}. Docker needs sudo on this host, and sudo
      # resets HOME to /root, where this file does not exist. Docker's response
      # to a missing bind-mount source is to silently create an empty
      # DIRECTORY, so update-ca-certificates finds nothing, PAPI trusts no
      # CAIOS certificate, and every outbound HTTPS call to our own domains
      # fails with SSL: CERTIFICATE_VERIFY_FAILED — surfacing as
      # "Fail to fetch data from the url" on endpoints that have nothing
      # obviously to do with certificates.
      - ./secrets/oscar-k8s.token:/run/secrets/oscar-k8s.token:ro
      - ./certs/caios-ca.pem:/usr/local/share/ca-certificates/caios-ca.crt:ro
      # Nomad's own certificates, written by Ansible on this node.
      - /etc/nomad.d/certs:/etc/nomad.d/certs:ro
    depends_on:
      - keycloak
      - vault

  # --------------------------------------------------------------------------
  # Registration approvals — T6.
  #
  # Turns a self-registered Keycloak account into one that can use the
  # platform, by granting the single realm role PAPI authorises on. "Pending"
  # is not stored anywhere: it is a user holding no access:<vo>:<level> role.
  #
  # Its own container rather than a PAPI router, deliberately. PAPI is what the
  # whole platform runs through; a fault in an admin console used by one person
  # a week must not be able to stop a demo. If this service is down, nothing
  # else notices and the demo accounts still work.
  #
  # Reached at /registration/* on the API hostname, so it adds no DNS name, no
  # certificate SAN, and no new browser origin.
  # --------------------------------------------------------------------------
  registration:
    build:
      context: ./registration
    image: caios/registration:latest
    container_name: caios_registration
    restart: unless-stopped
    environment:
      # The issuer this service validates callers against. Must be the same
      # string Keycloak mints and PAPI checks — all three follow CAIOS_SCHEME.
      CAIOS_SCHEME: ${CAIOS_SCHEME:-https}
      CAIOS_AUTH_HOST: ${CAIOS_AUTH_HOST}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      CAIOS_VO: vo.caios.ca
      # The service account. The only thing on the platform holding
      # realm-management rights, and it holds the narrowest pair that works:
      # view-users and manage-users, never realm-admin.
      KEYCLOAK_REGISTRATION_CLIENT: caios-registration
      KEYCLOAK_REGISTRATION_SECRET: ${KEYCLOAK_REGISTRATION_SECRET}
      # Both schemes, for the same reason PAPI lists both: an origin is
      # scheme-exact and a missing one is a CORS wall the browser reports as a
      # generic failure with nothing in our log to explain it.
      CAIOS_CORS_ORIGINS: https://${CAIOS_DASHBOARD_HOST},http://${CAIOS_DASHBOARD_HOST},http://localhost:8080
      # httpx uses certifi, not the system store, so point it at the bundle
      # update-ca-certificates refreshes at start.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      # Our CA, so the service can verify Keycloak over HTTPS. Repo-relative
      # and NOT ${HOME}: docker needs sudo here, sudo resets HOME to /root, and
      # docker answers a missing bind-mount source by silently creating an
      # empty DIRECTORY rather than failing (D-29).
      - ./certs/caios-ca.pem:/usr/local/share/ca-certificates/caios-ca.crt:ro
    ports:
      # Loopback. Caddy is the only thing that may reach it.
      - "127.0.0.1:8090:8090"
    depends_on:
      - keycloak

  # --------------------------------------------------------------------------
  # Dashboard — Angular SPA. Talks only to PAPI, never to Nomad.
  #
  # Built by scripts/build-dashboard.sh, which stages the caios tenant. The four
  # variables below are injected at container start by the image's own entrypoint,
  # so changing the API address or realm needs a restart, not a rebuild.
  # --------------------------------------------------------------------------
  dashboard:
    image: caios/dashboard:latest
    container_name: caios_dashboard
    restart: unless-stopped
    environment:
      # MUST include /v1. app.config.ts replaces environment.api.base with this
      # value wholesale, and the built-in default is
      # https://api.cloud.ai4eosc.eu/v1 — so dropping the suffix makes every
      # call land one level too high and return 404, surfacing in the UI as
      # "Error calling the API, please retry later Error: Not Found".
      API_SERVER: ${CAIOS_SCHEME}://${CAIOS_API_HOST}/v1
      ISSUER: ${CAIOS_SCHEME}://${CAIOS_AUTH_HOST}/realms/${KEYCLOAK_REALM}
      CLIENT_ID: caios-dashboard
      DUMMY_CLIENT_SECRET: ""
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - papi

volumes:
  keycloak_db_data:
  caddy_data:
  caddy_config:
  keycloak_data:
