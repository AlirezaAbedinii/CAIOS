---
# CAIOS configuration for PAPI.
#
# Copied from vendor/ai4-papi/etc/main.yaml at e80a2b7 and rewritten for a
# single VO. Mounted over /srv/ai4-papi/etc/main.yaml by compose/docker-compose.yml.
#
# ${CAIOS_CTRL_IP} is substituted at container start from configs/env/caios.env.
# If you are reading this before the IPs are known, that is why they are not
# literal.

self:  # info about the API endpoint

  domain: https://api.${CAIOS_PUBLIC_IP}.sslip.io

auth:

  CORS_origins:  # allows requests to the API from these domains

    - https://dashboard.${CAIOS_PUBLIC_IP}.sslip.io
    - http://localhost:8080          # local dashboard development
    - ${DASHBOARD_URL}               # expanded by PAPI from the environment

  VO:  # Virtual Organizations
    # MVP: one VO. V1 splits this into three (one per hospital site) so that a
    # site's login can only deploy to its own node. See docs/mvp-plan.md.
    - vo.caios.ca

nomad:

  namespaces:  # map VO to Nomad namespace
    # Must match nomad_namespaces in ansible/group_vars/all.yml, and must match
    # the meta.namespace tag on the compute nodes. A mismatch here produces
    # jobs that queue forever with no error anywhere.
    vo.caios.ca: caios

lb:  # load balancer, Traefik

  domain:  # each VO accesses deployments through their domain
    # Deployments resolve as: <service>-<uuid>.<meta.domain>-<this value>
    # meta.domain is `pacs`, set per node in ansible/inventory/hosts.ini, so a
    # Jupyter IDE lands at ide-a1b2c3.pacs-deployments.<EDGE_IP>.sslip.io
    #
    # Note this is caios_edge's IP (Traefik), not caios_server's.
    vo.caios.ca: deployments.${CAIOS_PUBLIC_IP}.sslip.io

oscar:
  # Stage O3. Was absent until 2026-08-26 (D-09 cut OSCAR from MVP), which made
  # PAPI's inference router raise KeyError -> HTTP 500 on endpoints the
  # dashboard's hardcoded /tasks/inference link can reach. Patch 0012 makes the
  # absence degrade instead of erroring; this block makes it present.
  #
  # cluster_id must match what OSCAR reports as `name` in /system/config.
  # endpoint is reached from inside the PAPI container over the private subnet,
  # verified against the CAIOS CA that compose already mounts.
  clusters:
    vo.caios.ca:
      endpoint: ${CAIOS_OSCAR_ENDPOINT}
      cluster_id: oscar

mlflow:
  # Not deployed for MVP. Left pointing at nothing rather than at AI4EOSC's
  # instance, so the dashboard cannot send our users to somebody else's MLflow.
  # V1 stretch goal replaces this with our own.
  vo.caios.ca: ''
