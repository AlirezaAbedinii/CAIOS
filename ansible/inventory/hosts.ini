; CAIOS cluster inventory
;
; Derived from vendor/ai4-ansible/hosts_ifca_admin_deploy_template.
; See docs/infrastructure.md for what each node does and why.
;
; ---------------------------------------------------------------------------
; NETWORK
;
; Every node is private (192.168.104.0/24 on Arbutus). There are no floating
; IPs. Ansible runs FROM caios_server, which is on that subnet already, so it
; reaches the others directly — no ProxyJump, no bastion hop.
;
; Humans get in over OpenVPN, then the jumpserver, then SSH.
;
; PREREQUISITE: caios_server needs an SSH key whose public half is in
; ~/.ssh/authorized_keys on all the others. See docs/runbook.md.
;
; ---------------------------------------------------------------------------
; NODE NAMES
;
; The names on the left are Ansible's, and are the ones that must avoid
; hyphens. They are unrelated to the OS hostnames (currently ai4eosc-N) and to
; the Nomad agent names, which Ansible generates as caios-wn-gpu-0 and similar.
; Hyphens there are expected.
; ---------------------------------------------------------------------------


; ===== Consul ==============================================================
; Exactly one Consul master, and it must be the same node as the Nomad master.

[consul_master]
caios_server ansible_host=192.168.104.181

[consul_clients]
caios_edge   ansible_host=192.168.104.105
caios_site_a ansible_host=192.168.104.20
caios_site_b ansible_host=192.168.104.145
caios_site_c ansible_host=192.168.104.7
caios_llm    ansible_host=192.168.104.188


; ===== Traefik =============================================================
; Exactly one Traefik node. Every deployment hostname resolves to its IP, and
; the Traefik Nomad job is pinned to it by node name.

[traefik_master]
caios_edge


; ===== Nomad ===============================================================
; nomad_dc must equal consul_dc_name in group_vars/all.yml. The upstream role
; writes `datacenter = "{{ consul_dc_name }}"` into every agent config, so a
; different value here would only rename files and cause confusion.

[nomad_master]
caios_server nomad_dc=caios

; The Traefik node is the cluster's only CPU client. This is required:
; ai4-ansible needs at least one, and Traefik is tagged meta.type=traefik,
; so it never receives user workloads anyway.
;
; domain=pacs  -> deployments land on *.pacs-deployments.<edge ip>.sslip.io
[nomad_cpu_clients]
caios_edge nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false

; The three hospital sites, plus the LLM host. All GPU, all compute.
;
;   !!  APPEND ONLY. roles/nomad/tasks/set_hostname.yml names each agent
;       caios-wn-gpu-<index in THIS list>. Inserting a host in the middle
;       renames every node after it, which breaks Consul registration and the
;       node names printed by the federated-learning demo. caios_llm is last,
;       so it becomes caios-wn-gpu-3 and the three sites keep 0, 1 and 2.
[nomad_gpu_clients]
caios_site_a nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false
caios_site_b nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false
caios_site_c nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false
caios_llm    nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false

; Not used. Do not delete the group — the role checks for its existence.
[nomad_tryme_clients]


; ===== Volumes =============================================================
;
;   !!  DESTRUCTIVE  !!  READ THIS BEFORE ADDING A NODE TO THIS GROUP.
;
; For every host listed here, playbook-nomad.yml will:
;   1. partition /dev/vdb        (wiping any existing partition table)
;   2. format the partition XFS  (wiping any existing filesystem)
;   3. mount it at /mnt/data and point Docker's storage there
;
; On these instances /dev/vdb is a 125 GB volume ALREADY formatted ext4 and
; ALREADY mounted at /mnt. Adding a host here therefore ERASES ITS /mnt.
;
; caios_server is NOT in this group and must never be added: this repository
; lives at /mnt/CAIOS on its volume. Its Docker storage is configured
; separately, without reformatting, by playbook-control-plane.yml.
;
; Before the first run, confirm each site node's /mnt holds nothing of value:
;   for ip in 192.168.104.20 192.168.104.145 192.168.104.7; do
;       echo "== $ip"; ssh ubuntu@$ip 'lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT; ls -A /mnt'
;   done
;
; Why XFS at all: Docker's per-container disk limits (storage-opt) require it,
; and ai4-nomad_tests asserts the device path /dev/vdb1 literally. Only Nomad
; client nodes need this. Server and Traefik nodes do not.

[nomad_volume]
caios_site_a vol_name=vdb partition_name=part1
caios_site_b vol_name=vdb partition_name=part1
caios_site_c vol_name=vdb partition_name=part1
; Added 2026-08-19. Its /mnt was confirmed to hold lost+found and nothing else
; by scripts/check-llm-node.sh before this line was written.
caios_llm    vol_name=vdb partition_name=part1


; ===== Monitoring ==========================================================

[monitoring]
caios_server


; ===== caios_llm — the LLM host ============================================
; 192.168.104.188, the sixth instance. Unassigned until 2026-08-19, when it was
; measured (scripts/check-llm-node.sh) and found identical to the three site
; nodes: 3 cores, 34 GB, one H100L-1-12C, a 125 GB /dev/vdb holding nothing.
;
; It joins as a fourth GPU compute client dedicated to the LLM tool (D-31), so
; vLLM and Open WebUI never compete with the three hospital nodes for CPU or
; GPU. Without it the LLM job cannot be placed at all — `nomad job plan` reports
; "Dimension cpu exhausted" on every node while the FL workspaces are running.
;
; It is NOT the CVAT host: CVAT needs ~72 GB of RAM in one place and this has
; 34, so D-16 stands.
;
; Its meta.role=llm tag is set in host_vars/caios_llm.yml.



; ###########################################################################
; ####### DO NOT MODIFY BELOW — group composition required by the role ######
; ###########################################################################

[consul_servers:children]
consul_master

[consul:children]
consul_clients
consul_servers

[nomad_servers:children]
nomad_master

[nomad_clients:children]
nomad_cpu_clients
nomad_gpu_clients

[nomad:children]
nomad_clients
nomad_servers
