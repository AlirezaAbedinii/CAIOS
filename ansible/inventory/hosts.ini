; CAIOS cluster inventory
;
; Derived from vendor/ai4-ansible/hosts_ifca_admin_deploy_template.
; See docs/infrastructure.md for what each node does and why.
;
; ---------------------------------------------------------------------------
; BEFORE FIRST RUN, replace every <...> placeholder:
;   <FIP1>            floating IP of caios_server  (public, SSH bastion)
;   <FIP2>            floating IP of caios_edge    (public, Traefik / ingress)
;   <IP_SITE_A/B/C>   private IPs of the three compute nodes
;
; Node names must NOT contain hyphens. Underscores are fine.
; Ansible renames the Nomad/Consul agents to caios-wn-gpu-0 etc. by itself;
; that is expected and unrelated.
; ---------------------------------------------------------------------------


; ===== Consul ==============================================================
; Exactly one Consul master, and it must be the same node as the Nomad master.

[consul_master]
caios_server ansible_host=<FIP1>

[consul_clients]
caios_edge   ansible_host=<FIP2>
caios_site_a ansible_host=<IP_SITE_A>
caios_site_b ansible_host=<IP_SITE_B>
caios_site_c ansible_host=<IP_SITE_C>


; ===== Traefik =============================================================
; Exactly one Traefik node, and it must have a public IP because DNS points
; at it. It is pinned here by node name in the Traefik Nomad job.

[traefik_master]
caios_edge


; ===== Nomad ===============================================================
; nomad_dc must equal consul_dc_name in group_vars/all.yml. The upstream role
; writes `datacenter = "{{ consul_dc_name }}"` into every agent config, so a
; different value here would only rename files and cause confusion.

[nomad_master]
caios_server nomad_dc=caios

; The Traefik node is the cluster's only CPU client. This is required:
; ai4-ansible needs at least one, and Traefik is tagged meta.type=traefik,
; so it never receives user workloads anyway.
;
; domain=pacs  -> deployments land on *.pacs-deployments.<base domain>
[nomad_cpu_clients]
caios_edge nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false

; The three hospital sites. All GPU, all identical, all compute.
[nomad_gpu_clients]
caios_site_a nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false
caios_site_b nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false
caios_site_c nomad_dc=caios domain=pacs nomad_namespaces=caios batch=false

; Not used. Do not delete the group — the role checks for its existence.
[nomad_tryme_clients]


; ===== Volumes =============================================================
; Compute nodes only. Ansible partitions the volume, formats it XFS and
; repoints Docker's data-root at it. The volume must already be attached in
; OpenStack and must appear as /dev/vdb — ai4-nomad_tests asserts exactly that.
;
; Traefik and server nodes do not need one.

[nomad_volume]
caios_site_a vol_name=vdb partition_name=part1
caios_site_b vol_name=vdb partition_name=part1
caios_site_c vol_name=vdb partition_name=part1


; ===== Monitoring ==========================================================

[monitoring]
caios_server




; ###########################################################################
; ####### DO NOT MODIFY BELOW — group composition required by the role ######
; ###########################################################################

[consul_servers:children]
consul_master

[consul:children]
consul_clients
consul_servers

[nomad_servers:children]
nomad_master

[nomad_clients:children]
nomad_cpu_clients
nomad_gpu_clients

[nomad:children]
nomad_clients
nomad_servers
