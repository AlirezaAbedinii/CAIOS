title: Federated learning with NVFlare
summary: NVFlare Dashboard and Federated learning server
description: |-
  NVIDIA FLARE (NVIDIA Federated Learning Application Runtime Environment) is a
  domain-agnostic, open-source, extensible SDK that allows researchers and data
  scientists to adapt existing ML/DL workflows to a federated paradigm.

  It enables platform developers to build a secure, privacy-preserving offering for a distributed multi-party collaboration.

