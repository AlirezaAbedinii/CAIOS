---
# User customizable configuration to make a deployment in Nomad.
# Additional non-customizable values (eg. ports) are hardcoded in `job.nomad`.

# All conf parameters follow the same structure:
# varname:
#  name: name of the parameter to be displayed to end user (mandatory)
#  value: (default) value of the parameter (mandatory)
#  options: restricted set of values that the parameter can take (optional)
#  description: some comments on the parameter to be displayed to the end user (optional)

# CPU/RAM limits are based on the current have GPU flavours we (IFCA) have deployed:
# * g13-gpuib-8-86:
#     - 8 GPUs Nvidia Tesla T4
#     - 86 VCPUs --> ~9.6 cores / gpu (reserving 10% for the node)
#     - 351 GB RAM --> ~40 GB / gpu (reserving 10% for the node)
# * g12-gpuib-2-64:
#     - 2 GPUs Nvidia Tesla V100
#     - 64 VCPUs --> ~28 cores / gpu (reserving 10% for the node)
#     - 127 GB RAM --> ~57 GB / gpu (reserving 10% for the node)

general:
  title:
    name: Deployment title
    value: ''
    description: Provide short title for this deployment (less than 45 characters). Useful when you have lots of different active deployments.

  desc:
    name: Deployment description
    value: ''
    description: Provide some additional extended information about this deployment.

  docker_image:
    name: Docker image
    value: 'ai4oshub/ai4os-demo-app'
    description: Docker image of your AI module.

  docker_tag:
    name: Docker tag
    value: 'latest'
    description: Docker tag to use. Tags are module dependent. Modules run on CPU here, so a `gpu` tag gains nothing.
    options: ['latest']

  # [CAIOS] Modules offer DEEPaaS and JupyterLab. Not VS Code: never tested here.
  #
  # The history, because the reason changed. On 2026-09-02 JupyterLab was taken
  # away from every module after posenet-tf died with "Running as root is not
  # recommended. Use --allow-root to bypass." — and this note generalised that to
  # all nine images, on the grounds that none passes the flag. That was the wrong
  # evidence: deep-start's own jupyter_notebook_config.py sets allow_root = True
  # and deep-start points JUPYTER_CONFIG_DIR at it, so the error only appears
  # when that file fails to load. On 2026-09-24 ai4os-yolo-torch came up in
  # Jupyter mode first time (docs/demo-plan.md, step 3's spike).
  #
  # posenet-tf itself was the exception, and a real one: its image ships an older
  # config in /srv/.jupyter without allow_root. Patch 0021 passes --allow-root
  # to every module's JupyterLab, and it now starts.
  #
  # So the rule is measurement, per module: scripts/check-modules.sh deploys
  # every module in the marketplace in both modes and records the result in
  # demo/modules/check-results.tsv, and tests/test_failed_deployments.py fails
  # if a module fails Jupyter mode without an open decision recorded against it.
  # Re-run it after changing the catalogue.
  #
  # Offering an option that crashes is still worse than not offering it.
  service:
    name: Service to run
    value: 'deepaas'
    description: DEEPaaS runs the module as an inference API with a web interface. JupyterLab opens a notebook inside the module's own environment, with its code and its model, to work with it directly.
    options: ['deepaas', 'jupyter']

  jupyter_password:
    name: IDE password
    value: ''
    description: Select a password for your IDE (JupyterLab or VS Code). It should have at least 9 characters.

hardware:
  # [CAIOS] Our nodes have 3 vCPU each, against the 64-86 of the reference
  # deployment, and Nomad reserves whole cores. With the mail sidecar patched
  # out (patches/ai4-papi/0005) a job reserves cpu_num cores plus ~500 MHz of
  # shared time for the UI task, so 2 fits on a 3-core node and 3 does not.
  #
  # Getting this wrong does not degrade performance — the job queues forever
  # with "Dimension cpu exhausted" and never starts. Raise when the nodes grow.
  cpu_num:
    name: Number of CPUs
    value: 1
    range: [1, 2]

  # [CAIOS] Modules run on CPU. Decided 2026-09-27 (D-83), on measurement.
  #
  # Every module image predates the H100 this cluster has. Five are on CUDA
  # 9-10, which cannot see a MIG slice at all; YOLO and Faster R-CNN (CUDA
  # 11.6) spent 25+ minutes compiling at their first GPU call; the benchmark
  # module (CUDA 11.0) never finished a matmul. So a GPU given to a module is
  # held, unusable, counted against the owner's two-GPU cap, and the module
  # runs on CPU anyway. The fix is rebuilding images on a newer base — measured
  # to work for YOLO (docs/demo-plan.md, "Can the modules run on the GPU?") and
  # planned for after the demo. Raise this range for a module the day its
  # rebuilt image is in the catalogue. GPUs stay offered where they work: the
  # LLM, the development environment, federated learning.
  gpu_num:
    name: Number of GPUs
    value: 0
    range: [0, 0]
    description: Modules run on CPU on this platform. Their images were built before this cluster's GPUs and cannot use them; the language models and the development environment use the GPUs.

  gpu_type:
    name: GPU model
    value: ''
    options: ['']
    description: Fill this field only if you have a *hard* requirement for a given kind of GPU model.

  ram:
    name: RAM memory (in MB)
    value: 8000
    range: [2000, 40000]

  disk:
    name: Disk memory (in MB)
    value: 10000
    range: [1000, 50000]

storage:
  rclone_conf:
    name: RCLONE configuration
    value: '/srv/.rclone/rclone.conf'
    description: rclone.conf location

  rclone_url:
    name: Storage URL
    value: ''
    description: Remote storage link to be accessed via rclone (webdav). For example, in Nextcloud `https://share.cloud.ai4eosc.eu/remote.php/dav/files/<USER-ID>`

  rclone_vendor:
    name: RCLONE vendor
    value: 'nextcloud'
    options: ['nextcloud']
    description: RCLONE vendor (webdav)

  rclone_user:
    name: RCLONE user
    value: ''
    description: rclone user to access a webdav remote storage

  rclone_password:
    name: RCLONE user password
    value: ''

  datasets:
    name: Info of the datasets you want to download
    value: []
    description: Each element in the list should be a dict containing "doi" and "force_pull" keys. It requires the definition of all RCLONE variables.
