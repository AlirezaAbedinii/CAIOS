---
# The public nginx proxy. See the [jumpserver] block in hosts.ini for what
# this machine is and what must never be done to it.

# ansible.cfg sets remote_user: ubuntu and private_key_file: ~/.ssh/caios_cluster
# for the cluster. The username happens to be the same here, but the key is a
# separate question: caios_cluster's public half has to be appended to
# ~/.ssh/authorized_keys on this machine, which is done from a workstation that
# already has access. Until it is, every task fails with
# "Permission denied (publickey)" and nothing else.
#
#   bash scripts/check-ssh.sh          # or just: ansible caios_jump -m ping
ansible_user: ubuntu

# Ubuntu 22.04.5, nginx 1.18.0. The version matters: 1.18 wants
# `listen 443 ssl http2;` and rejects the `http2 on;` form that arrived in
# 1.25.1. playbook-jumpserver.yml asserts this rather than assuming it.
caios_nginx_expected_version: "1.18"

# Which certificate the public server blocks serve.
#
#   caios-ca   /etc/nginx/certs/caios-*.pem, issued by our own CA. What is
#              there today, and what the rollback returns to.
#   acme       /etc/letsencrypt/live/<domain>/fullchain.pem, from Let's
#              Encrypt over DNS-01. Needs CAIOS_ACME_EMAIL and
#              CAIOS_CF_API_TOKEN in caios.env, and a real domain.
#
# Overridden per run by scripts/deploy-jumpserver.sh.
caios_tls_mode: caios-ca
