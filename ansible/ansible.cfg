[defaults]
inventory       = inventory/hosts.ini
# Our roles come FIRST. ansible/roles/NVIDIA.nvidia_driver deliberately
# shadows the Galaxy role of the same name, which grycap.docker pulls in as a
# hard dependency and which would install a public NVIDIA driver over our vGPU
# guest driver and reboot the node. First match in this list wins.
roles_path      = roles:../vendor/ai4-ansible/roles:~/.ansible/roles
remote_user     = ubuntu
# The dedicated cluster key, generated on caios_server. Not a personal key:
# it is scoped to this cluster and revocable without touching anyone's own
# access. See docs/ssh-setup.md.
private_key_file = ~/.ssh/caios_cluster
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml

[ssh_connection]
# No ProxyJump: Ansible runs on caios_server, which is already on the
# 192.168.104.0/24 subnet with the other four nodes.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s
pipelining = True
